<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refresh WhatsApp access token</title><link rel="stylesheet" href="/console/style.css"></head><body><aside><div class="brand">Agent Workspace</div><a href="/whatsapp">Back to WhatsApp</a></aside><main><h1>Refresh your WhatsApp access token</h1><p>Your other connection details are already saved privately. Only paste the new token generated by Meta.</p><p id="status" role="status">Loading your saved connection…</p><form id="refresh-form"><label>Saved Meta number<select id="phone" name="phone_id" required disabled></select></label><label>New access token<input name="access_token" type="password" autocomplete="new-password" minlength="10" maxlength="4096" required></label><button id="save" type="submit" disabled>Save new access token</button></form><p>Saving keeps automatic replies paused. We will check the connection before activation.</p></main><script src="/console/whatsapp-token.js"></script></body></html>
