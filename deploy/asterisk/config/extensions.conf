[general]
static=yes
writeprotect=yes

[local-pilot]
; No external-number patterns, trunk, transfer, forwarding or outbound route.
exten => 600,1,Answer()
 same => n,Set(TIMEOUT(absolute)=120)
 same => n,Echo()
 same => n,Hangup()

; The private bridge is permanently bound to one app/agent by the operator.
exten => 700,1,Answer()
 same => n,Set(TIMEOUT(absolute)=120)
 same => n,AudioSocket(${UUID()},voice-bridge:9092)
 same => n,Hangup()
