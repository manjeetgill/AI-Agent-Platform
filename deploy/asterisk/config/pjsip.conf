[global]
type=global
endpoint_identifier_order=username,ip

[system]
type=system
disable_tcp_switch=yes

[local-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; The compose pilot is accessible only on the operator's computer.
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1
external_signaling_port=15060
local_net=VOICE_SUBNET

[1001]
type=endpoint
transport=local-udp
context=local-pilot
disallow=all
allow=ulaw,alaw
auth=pilot-auth
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001]
type=aor
max_contacts=1
remove_existing=yes
