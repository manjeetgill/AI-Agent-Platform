[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "Independent read-only research agent service"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.2",
  "Pillow==12.3.0",
  "fastapi==0.141.1", "httpx==0.28.1", "pydantic==2.13.5",
  "psycopg[binary]==3.3.6", "psycopg-pool==3.3.3", "uvicorn==0.53.0",
]

[project.optional-dependencies]
financial = ["pyarrow==25.0.0"]
training = ["torch>=2.6,<3", "transformers>=5,<6", "peft>=0.17,<1"]
embeddings = ["sentence-transformers>=5,<6"]
voice = ["aiortc==1.15.0", "webrtcvad-wheels==2.0.14.post1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
audit = ["mypy>=1.15,<2", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform = ["migrations/*.sql", "console/*.html", "console/*.js", "console/*.mjs", "console/*.css", "public/*.html", "public/*.png", "probes/*.mjs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py311"
line-length = 110

# Incremental typing starts at the new validated provider boundary. This does
# not claim the older dynamic runtime has been fully type-checked.
[tool.mypy]
files = ["src/agent_platform/voice_config.py"]
follow_imports = "silent"
disallow_untyped_defs = true
