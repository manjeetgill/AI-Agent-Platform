[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "Independent read-only research agent service"
requires-python = ">=3.11"
dependencies = [
  "cryptography==46.0.7",
  "Pillow==12.3.0",
  "fastapi==0.141.1", "httpx==0.28.1", "pydantic==2.13.5",
  "psycopg[binary]==3.3.6", "psycopg-pool==3.3.3", "uvicorn==0.53.0",
]

[project.optional-dependencies]
voice = ["aiortc==1.15.0"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform = ["migrations/*.sql", "console/*.html", "console/*.js", "console/*.css", "public/*.html", "public/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py311"
line-length = 110
